# https://docs.gitlab.com/ci/variables/
# https://gitlab-docs-d6a9bb.gitlab.io/ee/ci/variables/predefined_variables.html
# https://docs.gitlab.com/ci/yaml/

stages:
  - init
  - test
  - build
  - release

# MAC_DOCKER — which Mac Mini Docker runner the jobs use (`default: tags` below). The
# protected `main` / `next` pipelines get `macos-protected` ("Kirbo Mini Protected":
# ref-protected, its own cache, protected-ref jobs only); every other pipeline keeps the
# shared `macos` runner (the global default under `variables:`). No job names either tag
# itself — always `$MAC_DOCKER`.
workflow:
  rules:
    # Run pipeline for pushes to default branch
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
      variables:
        MAC_DOCKER: macos-protected
    # Run pipeline for pushes to next (pre-release) branch
    - if: '$CI_COMMIT_BRANCH == "next"'
      variables:
        MAC_DOCKER: macos-protected
    # Run pipeline for all other branch pushes
    - if: "$CI_COMMIT_BRANCH"
    # Run pipeline for web/api triggers
    - if: '$CI_PIPELINE_SOURCE == "web"'

variables:
  DOCKER_TLS_CERTDIR: ""
  # Runner tag for every job — see `workflow:` (protected refs override it).
  MAC_DOCKER: "macos"
  # Docker Hub hosts the published images. Its credentials (and every other CI secret)
  # live in fnox.toml, decrypted per job tier — see ci/secrets.sh and docs/SECRETS.md.
  DOCKER_REGISTRY: docker.io
  DOCKER_BUILDER_NAME: "builder-${CI_JOB_ID}"
  DOCKERHUB_REPOSITORY: kirbownz/electrolux-to-mqtt
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar" # Defines the location of the analysis task cache
  GIT_DEPTH: "0" # Tells git to fetch all the branches of the project, required by the analysis task
  GIT_STRATEGY: clone

# Default configuration for all jobs
default:
  # The owner's Mac Mini runners (Linux containers, aarch64): `macos` (shared) or
  # `macos-protected` on main/next — chosen by MAC_DOCKER in `workflow:`.
  tags:
    - $MAC_DOCKER

################################################################### SHARED RULES ######################################################################

# Release/build gate: only paths that affect the shipped Docker image trigger a
# version bump, changelog, image build, and release. Deliberately excludes
# tests/vitest config (don't ship), docs, .claude/, CI config, scripts, and
# config examples. Test/lint/typecheck run off .rules_node_changes instead, and
# telemetry-backend has its own deploy job — neither bumps the app version.
.rules_code_changes:
  rules:
    - if: $SCHEDULE
      when: never
    - if: "$CI_COMMIT_TAG == null"
      changes:
        - docker/Dockerfile
        - docker/compat/**/*
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - src/**/*
        - tsconfig.json
      when: on_success
    - when: never

.rules_node_changes:
  rules:
    - if: $SCHEDULE
      when: never
    - if: "$CI_COMMIT_TAG == null"
      changes:
        - biome.jsonc
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - src/**/*
        - tests/**/*
        - tsconfig.json
        - vitest.config.ts
        - vitest.setup.ts
        - docker/Dockerfile
        - docker/compat/**/*
        # every node job bootstraps pnpm through it
        - scripts/bootstrap-pnpm.sh
      when: on_success
    - when: never

.rules_node_changes_or_schedule:
  rules:
    - if: '$SCHEDULE == "AUDIT" || $SCHEDULE == "RENOVATE"'
      when: never
    - if: $SCHEDULE
      when: on_success
    - if: "$CI_COMMIT_TAG == null"
      changes:
        - biome.jsonc
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - src/**/*
        - tests/**/*
        - tsconfig.json
        - vitest.config.ts
        - vitest.setup.ts
        - docker/Dockerfile
        - docker/compat/**/*
        # keep in step with .rules_node_changes: the node jobs need `install dependencies`
        - scripts/bootstrap-pnpm.sh
      when: on_success
    - when: never

################################################################### DOCKER SHARED TEMPLATE ##################################################################

# Shared base for all docker buildx jobs. Extending jobs override: rules, stage, needs, script.
# Registry credentials come from fnox. The default tier is ci/read (pull-only token, also
# on unprotected branches); the release jobs override the environment to release/publish
# and set DOCKER_LOGIN_TIER: publish to log in to Docker Hub with the push password.
.docker_build_base:
  image: docker:latest
  retry: 1
  interruptible: true
  allow_failure: false
  cache: []
  environment:
    name: ci/read
    action: prepare
  variables:
    DOCKER_HOST: "unix:///var/run/docker.sock"
    DOCKER_LOGIN_TIER: read
  before_script:
    - export BUILDER_NAME="${DOCKER_BUILDER_NAME:-shared-ci-builder}"
    - docker buildx inspect "${BUILDER_NAME}" >/dev/null 2>&1 || docker buildx create --name "${BUILDER_NAME}" --driver docker-container --use
    - . ci/secrets.sh
    - secrets_load read
    - echo "${DOCKERHUB_PASSWORD_READ}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin dhi.io
    - |
      if [ "${DOCKER_LOGIN_TIER}" = "publish" ]; then
        secret DOCKERHUB_PASSWORD publish | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin "${DOCKER_REGISTRY}"
      else
        echo "${DOCKERHUB_PASSWORD_READ}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin "${DOCKER_REGISTRY}"
      fi
    - unset DOCKERHUB_PASSWORD_READ
  after_script:
    # after_script runs in a fresh shell — BUILDER_NAME exported in before_script
    # is NOT visible here; use the pipeline-level variable directly or every job
    # leaks a buildkit container on the runner.
    - docker buildx rm "${DOCKER_BUILDER_NAME:-shared-ci-builder}" || true

################################################################### INCLUDES ######################################################################

include:
  - local: .gitlab/ci/01_init.yml
  - local: .gitlab/ci/02_test.yml
  - local: .gitlab/ci/03_build.yml
  - local: .gitlab/ci/04_release.yml
