# https://docs.gitlab.com/ci/variables/
# https://gitlab-docs-d6a9bb.gitlab.io/ee/ci/variables/predefined_variables.html
# https://docs.gitlab.com/ci/yaml/

stages:
  - init
  - test
  - build
  - release

# MAC_DOCKER — which Mac Mini Docker runner the jobs use (`default: tags` below). The
# protected `main` / `next` pipelines get `macos-protected` ("Kirbo Mini Protected":
# ref-protected, its own cache, protected-ref jobs only); every other pipeline keeps the
# shared `macos` runner (the global default under `variables:`). No job names either tag
# itself — always `$MAC_DOCKER`.
workflow:
  rules:
    # Run pipeline for pushes to default branch
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
      variables:
        MAC_DOCKER: macos-protected
    # Run pipeline for pushes to next (pre-release) branch
    - if: '$CI_COMMIT_BRANCH == "next"'
      variables:
        MAC_DOCKER: macos-protected
    # Run pipeline for all other branch pushes
    - if: "$CI_COMMIT_BRANCH"
    # Run pipeline for web/api triggers
    - if: '$CI_PIPELINE_SOURCE == "web"'

variables:
  # Runner tag for every job — see `workflow:` (protected refs override it).
  MAC_DOCKER: "macos"
  # Docker Hub hosts the published images. Its credentials (and every other CI secret)
  # live in fnox.toml, decrypted per job tier — see ci/secrets.sh and docs/SECRETS.md.
  DOCKER_REGISTRY: docker.io
  DOCKER_BUILDER_NAME: "builder-${CI_JOB_ID}"
  DOCKERHUB_REPOSITORY: kirbownz/electrolux-to-mqtt
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar" # Defines the location of the analysis task cache
  GIT_DEPTH: "0" # Tells git to fetch all the branches of the project, required by the analysis task
  GIT_STRATEGY: clone

# Default configuration for all jobs
default:
  # The owner's Mac Mini runners (Linux containers, aarch64): `macos` (shared) or
  # `macos-protected` on main/next — chosen by MAC_DOCKER in `workflow:`.
  tags:
    - $MAC_DOCKER

################################################################### SHARED RULES ######################################################################

# Release/build gate: only paths that affect the shipped Docker image trigger a
# version bump, changelog, image build, and release. Deliberately excludes
# tests/vitest config (don't ship), docs, .claude/, CI config, scripts, and
# config examples. Test/lint/typecheck run off .rules_node_changes instead, and
# telemetry-backend has its own deploy job — neither bumps the app version.
.rules_code_changes:
  rules:
    - if: $SCHEDULE
      when: never
    - if: "$CI_COMMIT_TAG == null"
      changes:
        - docker/Dockerfile
        - docker/compat/**/*
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - src/**/*
        - tsconfig.json
      when: on_success
    - when: never

.rules_node_changes:
  rules:
    - if: $SCHEDULE
      when: never
    - if: "$CI_COMMIT_TAG == null"
      changes:
        - biome.jsonc
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - src/**/*
        - tests/**/*
        - tsconfig.json
        - vitest.config.ts
        - vitest.setup.ts
        - docker/Dockerfile
        - docker/compat/**/*
        # every node job bootstraps pnpm through it
        - scripts/bootstrap-pnpm.sh
      when: on_success
    - when: never

.rules_node_changes_or_schedule:
  rules:
    - if: '$SCHEDULE == "AUDIT" || $SCHEDULE == "RENOVATE"'
      when: never
    - if: $SCHEDULE
      when: on_success
    - if: "$CI_COMMIT_TAG == null"
      changes:
        - biome.jsonc
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - src/**/*
        - tests/**/*
        - tsconfig.json
        - vitest.config.ts
        - vitest.setup.ts
        - docker/Dockerfile
        - docker/compat/**/*
        # keep in step with .rules_node_changes: the node jobs need `install dependencies`
        - scripts/bootstrap-pnpm.sh
      when: on_success
    - when: never

################################################################### DOCKER SHARED TEMPLATE ##################################################################

# Shared base for all docker buildx jobs. Extending jobs override: rules, stage, needs, script.
# Registry credentials come from fnox. The default tier is ci/read (pull-only token, also
# on unprotected branches); the release jobs override the environment to release/publish
# and set DOCKER_LOGIN_TIER: publish to log in to Docker Hub with the push password.
#
# No Docker engine: the jobs get no Docker socket, no DOCKER_HOST, no docker-container
# builder and no Docker-in-Docker. They build on a BuildKit server on the Mac Mini over
# mutual TLS (a buildx `remote` builder), reached from the job container at
# host.docker.internal: protected refs (main, next) use the protected server (:12340,
# client cert in the PROTECTED File variables BUILDKIT_PROTECTED_CA/_CERT/_KEY), every
# other ref the branch server (:12341, BUILDKIT_CA/_CERT/_KEY). Their caches are separate,
# so a branch build can never feed a release build. `docker login` and
# `docker buildx imagetools` need no daemon: the logins land in the job's
# ~/.docker/config.json and buildx hands them to BuildKit for each build.
# The client certificates expire 2029-02-08 (1Password "Kirbo Mini BuildKit protected
# mTLS" / "… branch mTLS"; rotation: docs/CONTRIBUTING.md § CI runners and BuildKit).
#
# The image is pinned by digest — it holds the publish tier's Docker Hub password on
# main/next. Bump it (and every other pinned CI image) per .claude/skills/maintain.
.docker_build_base:
  image: docker:29.9.2-cli@sha256:5e6baf67325a79f64ed3bed6863954d5e05d0f3d4e57cbdb14809346814bbfdb
  retry: 1
  interruptible: true
  allow_failure: false
  cache: []
  environment:
    name: ci/read
    action: prepare
  variables:
    DOCKER_LOGIN_TIER: read
  before_script:
    - export BUILDER_NAME="${DOCKER_BUILDER_NAME:-builder-${CI_JOB_ID}}"
    - |
      if [ "${CI_COMMIT_REF_PROTECTED}" = "true" ]; then
        BUILDKIT_PORT=12340 BK_CA="${BUILDKIT_PROTECTED_CA:-}" BK_CERT="${BUILDKIT_PROTECTED_CERT:-}" BK_KEY="${BUILDKIT_PROTECTED_KEY:-}"
      else
        BUILDKIT_PORT=12341 BK_CA="${BUILDKIT_CA:-}" BK_CERT="${BUILDKIT_CERT:-}" BK_KEY="${BUILDKIT_KEY:-}"
      fi
      if [ -z "${BK_CA}" ] || [ -z "${BK_CERT}" ] || [ -z "${BK_KEY}" ]; then
        echo "No BuildKit client certificate for this ref (protected=${CI_COMMIT_REF_PROTECTED:-false}) — check the BUILDKIT_* File variables." >&2
        exit 1
      fi
      docker buildx create --name "${BUILDER_NAME}" --driver remote \
        --driver-opt "cacert=${BK_CA},cert=${BK_CERT},key=${BK_KEY}" \
        "tcp://host.docker.internal:${BUILDKIT_PORT}" --use
      docker buildx inspect --bootstrap "${BUILDER_NAME}" >/dev/null
      unset BK_CA BK_CERT BK_KEY
    - . ci/secrets.sh
    - secrets_load read
    - echo "${DOCKERHUB_PASSWORD_READ}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin dhi.io
    - |
      if [ "${DOCKER_LOGIN_TIER}" = "publish" ]; then
        secret DOCKERHUB_PASSWORD publish | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin "${DOCKER_REGISTRY}"
      else
        echo "${DOCKERHUB_PASSWORD_READ}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin "${DOCKER_REGISTRY}"
      fi
    - unset DOCKERHUB_PASSWORD_READ
  after_script:
    # after_script runs in a fresh shell — BUILDER_NAME exported in before_script is NOT
    # visible here, so use the pipeline-level variable. A remote builder is only a local
    # client entry (nothing runs on the Mac per job); removing it is tidiness.
    - docker buildx rm "${DOCKER_BUILDER_NAME:-builder-${CI_JOB_ID}}" || true

################################################################### INCLUDES ######################################################################

include:
  - local: .gitlab/ci/01_init.yml
  - local: .gitlab/ci/02_test.yml
  - local: .gitlab/ci/03_build.yml
  - local: .gitlab/ci/04_release.yml
