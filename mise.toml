# Pinned dev/CI tooling, managed by mise (https://mise.jdx.dev).
#
# Version sources of truth live in the root package.json, not here:
#   - Node.js major: "engines.node"   (read via scripts/node-major.sh)
#   - Alpine:        "alpineVersion"  (read via scripts/alpine-version.sh) — the base
#                    of every Node image (dhi.io/node and stock node:<major>-alpine<ver>)
#   - pnpm:          "packageManager" (bump with `corepack use pnpm@latest`)
# package.json is a release-gated CI path, so bumping any of them cuts a release.
# Bumping Node = edit engines.node, then `pnpm sync:versions` to derive
# telemetry-backend engines + both @types/node ranges (CI "versions in sync"
# enforces it). Everything else reads package.json directly: mise itself
# ([tools]/[env] below), GitLab CI, the git hooks, the deploy jobs, and docker
# compose (via the exported NODE_VERSION/ALPINE_VERSION — Dockerfiles/compose have
# no defaults and fail loudly without them).
#
# Requires a trusted config (`mise trust`) — the exec() templates below run scripts.

# Oldest mise verified with this file (aqua backend + exec()/config_root templates).
# Older versions fail loudly here instead of mis-resolving tools.
min_version = "2026.9.9"

[tools]
node = """{{ exec(command="sh " ~ config_root ~ "/scripts/node-major.sh") }}"""
# pnpm, version read from package.json "packageManager" (single source of truth —
# bump it with `corepack use pnpm@latest`). Pinned to the aqua backend (GitHub-release
# binary) on purpose: pnpm 12+ ships a native binary fetched by an npm postinstall
# hook, and mise's idiomatic package.json support hardcodes the npm: backend, which
# installs with --ignore-scripts and leaves a shebang-less placeholder Node cannot
# run (verified broken on mise 2026.9.1 and 2026.9.8).
"aqua:pnpm/pnpm" = """{{ exec(command="grep -m1 -o 'pnpm@[0-9.]*' " ~ config_root ~ "/package.json | cut -d@ -f2") }}"""
# sops MUST be built against age >= 1.3.0 to decrypt the project's NATIVE
# post-quantum (ML-KEM-768 + X25519) age recipient (`age1pq1…`). Older sops and the
# Rust `rage` impl CANNOT decrypt these files. Pin to the version you run locally
# (`sops --version`) so CI decryption matches.
sops = "3.13.1"
# age CLI — used for key generation / `pnpm sops:rotate`. Decryption itself goes
# through sops's embedded age library, so CI badge decryption needs only sops.
age = "1.3.1"
# git-cliff — changelog/release-notes generator (cliff.toml). CI runs the
# orhunp/git-cliff image at this SAME version (read via scripts/tool-version.sh),
# so `scripts/mr-description.sh` locally and the release-notes job agree.
git-cliff = "2.14.2"

[env]
# Exported so `docker compose` (and manual docker builds) pick the Node major and
# Alpine version up automatically — compose/Dockerfiles require them and fail loudly
# when unset. Only exported into an ACTIVATED shell (`mise activate`), not via shims.
NODE_VERSION = """{{ exec(command="sh " ~ config_root ~ "/scripts/node-major.sh") }}"""
ALPINE_VERSION = """{{ exec(command="sh " ~ config_root ~ "/scripts/alpine-version.sh") }}"""

[tasks.sync-versions]
description = "Derive telemetry-backend engines + @types/node from package.json engines.node"
run = "bash scripts/sync-versions.sh"
