# Pinned dev/CI tooling, managed by mise (https://mise.jdx.dev).
#
# SINGLE SOURCE OF TRUTH for Node.js major + Alpine version ([vars] below).
# pnpm version lives in package.json "packageManager" (read by mise via the
# exec template in [tools] below, and by corepack).
#
# After editing [vars], run `mise run sync-versions` (or `pnpm sync:versions`)
# to propagate node_major to package.json engines (root + telemetry-backend).
# Everything else reads this file directly: mise itself ([tools]/[env]),
# GitLab CI (.gitlab/ci/01_init.yml parses node_major + alpine_version), the
# git hooks (.githooks/common.sh), and docker compose (via the exported
# NODE_VERSION — Dockerfiles/compose have no defaults and fail loudly without it).
# The CI job "versions in sync" enforces the engines sync.
[vars]
# Node.js LTS major.
node_major = "24"
# Alpine minor used in the prod Docker image tag (dhi.io/node:<node>-alpine<alpine>)
# and the CI node:<node>-alpine<alpine> images.
alpine_version = "3.24"

[tools]
node = "{{ vars.node_major }}"
# pnpm, version read from package.json "packageManager" (single source of truth —
# bump it with `corepack use pnpm@latest`). Pinned to the aqua backend (GitHub-release
# binary) on purpose: pnpm 12+ ships a native binary fetched by an npm postinstall
# hook, and mise's idiomatic package.json support hardcodes the npm: backend, which
# installs with --ignore-scripts and leaves a shebang-less placeholder Node cannot
# run (verified broken on mise 2026.9.1 and 2026.9.8).
"aqua:pnpm/pnpm" = """{{ exec(command="grep -m1 -o 'pnpm@[0-9.]*' " ~ config_root ~ "/package.json | cut -d@ -f2") }}"""
# sops MUST be built against age >= 1.3.0 to decrypt the project's NATIVE
# post-quantum (ML-KEM-768 + X25519) age recipient (`age1pq1…`). Older sops and the
# Rust `rage` impl CANNOT decrypt these files. Pin to the version you run locally
# (`sops --version`) so CI decryption matches.
sops = "3.13.1"
# age CLI — used for key generation / `pnpm sops:rotate`. Decryption itself goes
# through sops's embedded age library, so CI badge decryption needs only sops.
age = "1.3.1"

[env]
# Exported so `docker compose` (and manual docker builds) pick the Node major up
# automatically — compose/Dockerfiles require it and fail loudly when unset.
NODE_VERSION = "{{ vars.node_major }}"
ALPINE_VERSION = "{{ vars.alpine_version }}"

[tasks.sync-versions]
description = "Propagate node_major from mise.toml [vars] to package.json engines"
run = "bash scripts/sync-versions.sh"
