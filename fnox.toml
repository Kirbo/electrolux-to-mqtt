# Secrets for local maintainer work and GitLab CI (https://fnox.jdx.dev). Every value
# is age CIPHERTEXT — change one with `pnpm secrets:set <profile> <NAME>`, never by hand.
#
# Recipients are PUBLIC keys. Each provider encrypts to the maintainer + only the CI
# tiers named on it, so the provider a secret uses decides who can read it:
#   maintainer   1Password "electrolux-to-mqtt age key"; locally the OS keychain via the
#                generated fnox.local.toml (`pnpm secrets:setup`)
#   ci-<tier>    GitLab File variable FNOX_AGE_KEY_FILE scoped to environment ci/read,
#                release/publish, release/deploy or ci/sonar (`pnpm secrets:rotate-ci <tier>`
#                generates it, rewrites its `# ci-<tier>` lines below and re-encrypts)
# No identity lives in this file. Post-quantum (age1pq1…) keys reach fnox through
# age-plugin-pq (shipped with age, versions.env). docs/SECRETS.md has the design.
#
# Secrets live only in profiles (one per job group); CI loads them with
# `--no-defaults -P <profile>` (ci/secrets.sh).
if_missing = "error"

[providers.age_read]  # registry pulls: every image build
type = "age"
recipients = [
  "", # maintainer
  "", # ci-read
  "", # ci-publish
]
[providers.age_publish]  # Docker Hub push: release image jobs
type = "age"
recipients = [
  "", # maintainer
  "", # ci-publish
]
[providers.age_deploy]  # telemetry-backend server + its runtime .env
type = "age"
recipients = [
  "", # maintainer
  "", # ci-deploy
]
[providers.age_sonar]  # SonarCloud analysis
type = "age"
recipients = [
  "", # maintainer
  "", # ci-sonar
]

