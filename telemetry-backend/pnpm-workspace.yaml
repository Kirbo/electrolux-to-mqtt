allowBuilds:
  esbuild: true

# esbuild>=0.28.1: fixes GHSA-gv7w-rqvm-qjhr (high) + GHSA-g7r4-m6w7-qqqr (low),
# transitive via vite/tsx/vitest. Remove once upstream deps bump their floor.
overrides:
  esbuild: ">=0.28.1"

# @types/node must never lead the Node runtime major. A version range cannot
# enforce that — `pnpm update --latest` rewrites the spec whatever it declares —
# so the dependency is ignored by the updater instead. This package has its own
# lockfile and is not a workspace member, so it needs its own copy of this stanza.
# `scripts/sync-versions.sh` (at the repo root) is the single writer; it derives
# the range from `mise.toml [vars] node_major` and rewrites BOTH package.json files.
updateConfig:
  ignoreDependencies:
    - "@types/node"
