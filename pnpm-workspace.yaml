allowBuilds:
  esbuild: true
  "@biomejs/biome": true

# ws>=8.20.1: fixes GHSA-58qx-3vcg-4xpx (uninitialized memory disclosure,
# transitive via mqtt>ws). Remove once mqtt bumps its own dep floor past 8.20.0.
# esbuild>=0.28.1: fixes GHSA-gv7w-rqvm-qjhr (high) + GHSA-g7r4-m6w7-qqqr (low),
# transitive via vite/tsx/vitest. Remove once upstream deps bump their floor.
overrides:
  ws: ">=8.20.1"
  esbuild: ">=0.28.1"

# @types/node must never lead the Node runtime major — types ahead of the runtime
# describe APIs that do not exist at execution time. A version RANGE cannot enforce
# this: `pnpm update --latest` rewrites the spec regardless of what it declares
# (verified — an explicit ">=24.0.0 <25.0.0" was rewritten to "^26.1.2"). Ignoring
# the dependency here is what actually holds it.
#
# `scripts/sync-versions.sh` remains the single writer, deriving the range from
# `mise.toml [vars] node_major`. To move it, bump mise.toml and run `pnpm sync:versions`
# — never by hand, and never with `pnpm update --latest @types/node` (naming a
# package explicitly overrides this list).
updateConfig:
  ignoreDependencies:
    - "@types/node"
