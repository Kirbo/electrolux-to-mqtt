################################################################### INIT STAGE JOBS ###################################################################

initialise variables:
  stage: init
  image: alpine:latest
  interruptible: true
  rules:
    - if: $SCHEDULE
      when: on_success
    - if: "$CI_COMMIT_TAG == null"
      changes:
        - biome.jsonc
        - docker/Dockerfile
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - src/**/*
        - telemetry-backend/**/*
        - tests/**/*
        - tsconfig.json
        - vitest.config.ts
        - vitest.setup.ts
      when: on_success
    - when: never
  cache: []
  artifacts:
    reports:
      dotenv: variables.env
  script:
    - touch variables.env
    # Node major + Alpine come from mise.toml [vars] — the single source of truth.
    - NODE_MAJOR=$(sed -n 's/^node_major *= *"\([0-9][0-9]*\)".*/\1/p' mise.toml)
    - ALPINE=$(sed -n 's/^alpine_version *= *"\([0-9.]*\)".*/\1/p' mise.toml)
    - test -n "${NODE_MAJOR}" || { echo "ERROR could not parse node_major from mise.toml"; exit 1; }
    - test -n "${ALPINE}" || { echo "ERROR could not parse alpine_version from mise.toml"; exit 1; }
    # NODE_VERSION stays the combined image tag — both stock node (node:24-alpine3.24)
    # and dhi.io/node use the <major>-alpine<ver> suffix convention. The pieces are
    # exported separately for jobs that need just one of them.
    - echo "NODE_MAJOR=${NODE_MAJOR}" >> variables.env
    - echo "ALPINE_VERSION=${ALPINE}" >> variables.env
    - echo "NODE_VERSION=${NODE_MAJOR}-alpine${ALPINE}" >> variables.env

bump version:
  stage: init
  image: alpine:latest
  interruptible: true
  extends: .rules_code_changes
  cache: []
  artifacts:
    paths:
      - .version-unreleased
      - build.env
      - sonar-project.properties
    expire_in: never
  before_script:
    - apk add --no-cache git
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - git remote set-url origin "$CI_REPOSITORY_URL" || echo 'Not a git repository; skipping'
    # Fail hard: computing a CalVer from a stale local tag list could reuse an
    # existing version and overwrite its immutable Docker tag.
    - git fetch --tags --force
  script:
    # CalVer computation lives in scripts/compute-version.sh; writes
    # .version-unreleased, build.env, and appends sonar.projectVersion.
    - sh scripts/compute-version.sh
    - cat build.env

generate release notes:
  stage: init
  image:
    name: orhunp/git-cliff:latest
    entrypoint: [""]
  interruptible: true
  extends: .rules_code_changes
  cache: []
  # git-cliff reads tags via embedded gix; mark the checkout safe to avoid a
  # dubious-ownership refusal regardless of the runner's UID mapping.
  variables:
    GIT_CONFIG_COUNT: "1"
    GIT_CONFIG_KEY_0: safe.directory
    GIT_CONFIG_VALUE_0: "*"
  needs:
    - job: bump version
      artifacts: true
  artifacts:
    paths:
      - UNRELEASED-CHANGELOG.md
    expire_in: never
  script:
    # VERSION + CHANGELOG_RANGE come from build.env (bump version artifact);
    # the git-cliff invocation lives in scripts/generate-release-notes.sh.
    - sh scripts/generate-release-notes.sh
    - echo "===== UNRELEASED-CHANGELOG.md =====" && cat UNRELEASED-CHANGELOG.md

install dependencies:
  stage: init
  image: node:${NODE_VERSION}
  interruptible: true
  extends: .rules_node_changes_or_schedule
  cache:
    key:
      prefix: ${CI_COMMIT_REF_SLUG}
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
      - node_modules
    policy: push
  needs:
    - job: initialise variables
      artifacts: true
  before_script:
    - corepack enable
    - corepack install
    - pnpm config set store-dir .pnpm-store
    - echo "Node major from mise.toml [vars]:"
    - sed -n 's/^node_major *= *"\([0-9][0-9]*\)".*/\1/p' mise.toml
    - node --version
    - npm --version
    - pnpm --version
  script:
    - echo "Installing dependencies..."
    - pnpm install --frozen-lockfile --config.scripts-prepend-node-path=true
