################################################################### INIT STAGE JOBS ###################################################################

initialise variables:
  stage: init
  image: alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
  interruptible: true
  rules:
    - if: $SCHEDULE
      when: on_success
    - if: "$CI_COMMIT_TAG == null"
      changes:
        - biome.jsonc
        - versions.env
        - docker/Dockerfile
        - docker/compat/**/*
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - src/**/*
        - telemetry-backend/**/*
        - tests/**/*
        - tsconfig.json
        - vitest.config.ts
        - vitest.setup.ts
      when: on_success
    - when: never
  cache: []
  artifacts:
    reports:
      dotenv: variables.env
  script:
    # versions.env is the single source of truth for every version: its KEY=value lines
    # become dotenv variables for every later job (NODE_MAJOR, ALPINE_VERSION,
    # COREPACK_VERSION, GIT_CLIFF_VERSION, …) — the same names the Dockerfiles take as
    # build-args. sync-versions.sh (job `versions in sync`) guarantees the format.
    - grep -E '^[A-Z][A-Z0-9_]*=' versions.env > variables.env
    - . ./variables.env
    # NODE_IMAGE_TAG: the <major>-alpine<ver> tag of the CI job images (stock node).
    - echo "NODE_IMAGE_TAG=${NODE_MAJOR:?}-alpine${ALPINE_VERSION:?}" >> variables.env
    - cat variables.env

bump version:
  stage: init
  image: alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
  interruptible: true
  extends: .rules_code_changes
  cache: []
  artifacts:
    paths:
      - .version-unreleased
      - build.env
      - sonar-project.properties
    expire_in: never
  before_script:
    - apk add --no-cache git
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - git remote set-url origin "$CI_REPOSITORY_URL" || echo 'Not a git repository; skipping'
    # Fail hard: computing a CalVer from a stale local tag list could reuse an
    # existing version and overwrite its immutable Docker tag.
    - git fetch --tags --force
  script:
    # CalVer computation lives in scripts/compute-version.sh; writes
    # .version-unreleased, build.env, and appends sonar.projectVersion.
    - sh scripts/compute-version.sh
    - cat build.env

generate release notes:
  stage: init
  image:
    name: orhunp/git-cliff:${GIT_CLIFF_VERSION}
    entrypoint: [""]
  interruptible: true
  extends: .rules_code_changes
  cache: []
  # git-cliff reads tags via embedded gix; mark the checkout safe to avoid a
  # dubious-ownership refusal regardless of the runner's UID mapping.
  variables:
    GIT_CONFIG_COUNT: "1"
    GIT_CONFIG_KEY_0: safe.directory
    GIT_CONFIG_VALUE_0: "*"
  needs:
    # GIT_CLIFF_VERSION (image tag) comes from its dotenv
    - job: initialise variables
      artifacts: true
    - job: bump version
      artifacts: true
  artifacts:
    paths:
      - UNRELEASED-CHANGELOG.md
    expire_in: never
  script:
    # VERSION + CHANGELOG_RANGE come from build.env (bump version artifact);
    # the git-cliff invocation lives in scripts/generate-release-notes.sh.
    - sh scripts/generate-release-notes.sh
    - echo "===== UNRELEASED-CHANGELOG.md =====" && cat UNRELEASED-CHANGELOG.md

install dependencies:
  stage: init
  image: node:${NODE_IMAGE_TAG}
  interruptible: true
  extends: .rules_node_changes_or_schedule
  cache:
    key:
      prefix: ${CI_COMMIT_REF_SLUG}
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
      - node_modules
    policy: push
  needs:
    - job: initialise variables
      artifacts: true
  before_script:
    - sh scripts/bootstrap-pnpm.sh
    - pnpm config set store-dir .pnpm-store
    - echo "Node major from versions.env = ${NODE_MAJOR}"
    - node --version
    - npm --version
    - pnpm --version
  script:
    - echo "Installing dependencies..."
    - pnpm install --frozen-lockfile --config.scripts-prepend-node-path=true

# Renovate (renovate.json): weekly dependency MRs against `next`. Runs ONLY from a
# pipeline schedule with variable SCHEDULE=RENOVATE (on `main`, so the protected
# environment can hand out its key). Tier ci/renovate: RENOVATE_TOKEN (GitLab PAT,
# scopes api + write_repository) and GITHUB_COM_TOKEN (read-only, for GitHub release
# lookups) come from fnox profile `renovate`, in renovate's environment only.
# Setup: docs/CONTRIBUTING.md § Dependency updates.
renovate:
  stage: init
  image: ghcr.io/renovatebot/renovate:${RENOVATE_VERSION}
  interruptible: true
  rules:
    - if: '$SCHEDULE == "RENOVATE"'
      when: on_success
    - when: never
  needs:
    - job: initialise variables
      artifacts: true
  cache:
    key: renovate
    paths:
      - renovate/cache
  environment:
    name: ci/renovate
    action: prepare
  variables:
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: ${CI_API_V4_URL}
    RENOVATE_REPOSITORIES: ${CI_PROJECT_PATH}
    RENOVATE_ONBOARDING: "false"
    RENOVATE_REQUIRE_CONFIG: required
    RENOVATE_BASE_DIR: ${CI_PROJECT_DIR}/renovate
    RENOVATE_CACHE_DIR: ${CI_PROJECT_DIR}/renovate/cache
    LOG_LEVEL: info
  script:
    - . ci/secrets.sh
    - fnox exec --no-defaults --if-missing error -P renovate -- renovate
