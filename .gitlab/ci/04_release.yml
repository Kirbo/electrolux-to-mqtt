################################################################# RELEASE STAGE JOBS ##################################################################

build and deploy docker images:
  extends: .docker_build_base
  stage: release
  rules:
    - if: $SCHEDULE
      when: never
    - if: '$CI_COMMIT_TAG == null && $CI_COMMIT_BRANCH == "main"'
      changes:
        - docker/Dockerfile
        - docker/compat/**/*
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - src/**/*
        - tsconfig.json
      when: on_success
    - when: never
  environment:
    name: release/publish
    action: prepare
  variables:
    DOCKER_LOGIN_TIER: publish
  needs:
    - job: initialise variables
      artifacts: true
    - job: bump version
      artifacts: true
    - job: sonarcloud-check
      artifacts: false
      optional: true
    - job: generate changelog
      artifacts: true
  script:
    # Pushes :${VERSION} + :latest with UPDATE_CHANNEL=stable baked in; tag/channel
    # rationale lives in scripts/docker-buildx-release.sh (sources build.env itself).
    - sh scripts/docker-buildx-release.sh stable

create gitlab release:
  stage: release
  image: registry.gitlab.com/kirbodev/agentic-coding/ci-images/alpine-tools:20261106-c7036b18@sha256:781dd3d2ab58988bfe4d24d0096c2b69e0ccd4bc73d95106fe97134b2db623e9
  interruptible: true
  rules:
    - if: $SCHEDULE
      when: never
    - if: '$CI_COMMIT_TAG == null && $CI_COMMIT_BRANCH == "main"'
      changes:
        - docker/Dockerfile
        - docker/compat/**/*
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - src/**/*
        - tsconfig.json
      when: on_success
    - when: never
  cache: []
  needs:
    - job: initialise variables
      artifacts: false
    - job: bump version
      artifacts: true
    - job: generate release notes
      artifacts: true
    - job: build and deploy docker images
      artifacts: false
    - job: build and deploy beta docker images
      artifacts: false
  before_script:
  script:
    # Release + tag via the GitLab Releases API; shared with the prerelease job.
    - sh scripts/create-gitlab-release.sh

build and deploy beta docker images:
  extends: .docker_build_base
  stage: release
  rules:
    - if: $SCHEDULE
      when: never
    - if: '$CI_COMMIT_TAG == null && ($CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "next")'
      changes:
        - docker/Dockerfile
        - docker/compat/**/*
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - src/**/*
        - tsconfig.json
      when: on_success
    - when: never
  environment:
    name: release/publish
    action: prepare
  variables:
    DOCKER_LOGIN_TIER: publish
  needs:
    - job: initialise variables
      artifacts: true
    - job: bump version
      artifacts: true
    - job: sonarcloud-check
      artifacts: false
      optional: true
    - job: generate changelog
      artifacts: true
  script:
    # Pushes :next (+ :${VERSION} on the next branch) with UPDATE_CHANNEL=beta baked
    # in; tag/channel rationale lives in scripts/docker-buildx-release.sh.
    - sh scripts/docker-buildx-release.sh beta

create gitlab prerelease:
  stage: release
  image: registry.gitlab.com/kirbodev/agentic-coding/ci-images/alpine-tools:20261106-c7036b18@sha256:781dd3d2ab58988bfe4d24d0096c2b69e0ccd4bc73d95106fe97134b2db623e9
  interruptible: true
  rules:
    - if: $SCHEDULE
      when: never
    - if: '$CI_COMMIT_TAG == null && $CI_COMMIT_BRANCH == "next"'
      changes:
        - docker/Dockerfile
        - docker/compat/**/*
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - src/**/*
        - tsconfig.json
      when: on_success
    - when: never
  cache: []
  needs:
    - job: initialise variables
      artifacts: false
    - job: bump version
      artifacts: true
    - job: generate release notes
      artifacts: true
    - job: build and deploy beta docker images
      artifacts: false
  before_script:
  script:
    # Same API call as "create gitlab release" — one shared script.
    - sh scripts/create-gitlab-release.sh

# Jobs that hold a release/deploy secret run in digest-pinned images: ci-images' alpine-deploy
# (openssh client + curl baked in, nothing installed at job time) for these, docker:*-cli for
# the image pushes. Images: gitlab.com/KirboDev/agentic-coding/ci-images. Re-pin per /maintain.
#
# Deploy tier (environment release/deploy → its FNOX_AGE_KEY_FILE): the server address,
# SSH key and pinned host key come from fnox profile `deploy`. The key goes straight into
# ssh-agent (never a file on the runner); the host key is pinned (no ssh-keyscan TOFU).
.ssh_deploy: &ssh_deploy
  - . ci/secrets.sh
  - secrets_load deploy
  - eval "$(ssh-agent -s)" >/dev/null
  - printf '%s' "${SSH_KEY}" | base64 -d | ssh-add - >/dev/null
  - unset SSH_KEY
  - mkdir -p ~/.ssh && chmod 700 ~/.ssh
  - printf '%s\n' "${SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts

# Pull latest on the server, then write telemetry-backend/.env there from fnox profile
# `telemetry`: the dotenv is piped through ssh into a 0600 file, so the plaintext never
# touches the runner's disk. The server stores neither fnox nor any key.
# Export FIRST (a failure ends the job before the server is touched), then replace the
# server's .env atomically (temp file + mv): a truncating `cat > .env` fed by a failed
# export would leave it empty and the next `up -d` would start the backend without creds.
.deploy_backend_env: &deploy_backend_env
  - ssh ${TELEMETRY_USER}@${TELEMETRY_HOST} "cd ${TELEMETRY_PATH} && git fetch origin ${CI_COMMIT_BRANCH} && git checkout ${CI_COMMIT_BRANCH} && git pull origin ${CI_COMMIT_BRANCH}"
  - BACKEND_ENV=$(fnox export --no-defaults --if-missing error -P telemetry --format env)
  - test -n "${BACKEND_ENV}" || { echo "fnox profile telemetry exported nothing — refusing to overwrite the server .env" >&2; exit 1; }
  - printf '%s\n' "${BACKEND_ENV}" | ssh ${TELEMETRY_USER}@${TELEMETRY_HOST} "umask 077 && cd ${TELEMETRY_PATH}/telemetry-backend && cat > .env.tmp && mv .env.tmp .env"
  - unset BACKEND_ENV

deploy telemetry-backend:
  stage: release
  image: registry.gitlab.com/kirbodev/agentic-coding/ci-images/alpine-deploy:20261106-c7036b18@sha256:a50329092247db23f73d9919bebf0f55ae09f61c9229623aa65b908202fd436d
  rules:
    - if: $SCHEDULE
      when: never
    - if: '$CI_COMMIT_TAG == null && ($CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "next")'
      changes:
        - telemetry-backend/**/*
        # a rotated backend secret (fnox profile `telemetry`) must reach the server's .env
        - fnox.toml
      when: on_success
    - when: never
  cache: []
  needs:
    - job: build and deploy docker images
      artifacts: false
      optional: true
    # optional: a fnox.toml-only pipeline (secret rotation) has no backend test job
    - job: telemetry-backend test
      artifacts: false
      optional: true
  environment:
    name: release/deploy
    action: prepare
  before_script:
    - *ssh_deploy
  script:
    - *deploy_backend_env
    - ssh ${TELEMETRY_USER}@${TELEMETRY_HOST} "cd ${TELEMETRY_PATH} && sh scripts/backend-up.sh -d"

# After a bridge release (new tag + GitLab release), regenerate the badges in the *running*
# backend so the version badges reflect the new release immediately instead of waiting up to
# BADGE_INTERVAL_SECONDS for the next cycle. A one-shot `regenerate-badges` script runs inside
# the container and rewrites the SVGs on the shared badge volume — no restart, no rebuild.
# (A plain `up -d` would be a no-op here, since the image/config is unchanged — which is why the
# beta badge went stale after a beta-only release.)
refresh telemetry badges:
  stage: release
  image: registry.gitlab.com/kirbodev/agentic-coding/ci-images/alpine-deploy:20261106-c7036b18@sha256:a50329092247db23f73d9919bebf0f55ae09f61c9229623aa65b908202fd436d
  rules:
    - if: $SCHEDULE
      when: never
    - if: '$CI_COMMIT_TAG == null && ($CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "next")'
      changes:
        - docker/Dockerfile
        - docker/compat/**/*
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - src/**/*
        - tsconfig.json
      when: on_success
    - when: never
  cache: []
  needs:
    - job: create gitlab release
      artifacts: false
      optional: true
    - job: create gitlab prerelease
      artifacts: false
      optional: true
    - job: deploy telemetry-backend
      artifacts: false
      optional: true
  environment:
    name: release/deploy
    action: prepare
  before_script:
    - *ssh_deploy
  script:
    - ssh ${TELEMETRY_USER}@${TELEMETRY_HOST} "cd ${TELEMETRY_PATH} && docker compose -f telemetry-backend/docker-compose.yml exec -T telemetry-backend node dist/regenerate-badges.js"

prepare dockerhub readme:
  stage: release
  image: alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
  interruptible: true
  rules:
    - if: $SCHEDULE
      when: never
    - if: '$CI_COMMIT_TAG == null && $CI_COMMIT_BRANCH == "main"'
      changes:
        - README.md
      when: on_success
    - when: never
  cache: []
  needs: []
  script:
    # Docker Hub hosts only the README — relative repo links (./docs/..., ./config.example.yml)
    # 404 there. Rewrite them to absolute GitLab blob URLs so they resolve from Docker Hub.
    # Intra-page #anchors and already-absolute http(s) links are left untouched.
    - sed "s#](\./#](${CI_PROJECT_URL}/-/blob/${CI_DEFAULT_BRANCH}/#g" README.md > README.dockerhub.md
  artifacts:
    paths:
      - README.dockerhub.md
    expire_in: 1 hour

update dockerhub description:
  stage: release
  image: registry.gitlab.com/kirbodev/agentic-coding/ci-images/alpine-tools:20261106-c7036b18@sha256:781dd3d2ab58988bfe4d24d0096c2b69e0ccd4bc73d95106fe97134b2db623e9
  interruptible: true
  environment:
    name: release/publish
    action: prepare
  variables:
    # Push the link-rewritten copy from "prepare dockerhub readme", not the repo README,
    # so the description shown on Docker Hub has working links.
    README_FILEPATH: ${CI_PROJECT_DIR}/README.dockerhub.md
  rules:
    - if: $SCHEDULE
      when: never
    - if: '$CI_COMMIT_TAG == null && $CI_COMMIT_BRANCH == "main"'
      changes:
        - README.md
      when: on_success
    - when: never
  cache: []
  needs:
    - job: prepare dockerhub readme
      artifacts: true
    - job: build and deploy docker images
      artifacts: false
      optional: true
  script:
    - . ci/secrets.sh
    - secrets_load read
    - secret DOCKERHUB_PASSWORD publish | sh scripts/dockerhub-description.sh
